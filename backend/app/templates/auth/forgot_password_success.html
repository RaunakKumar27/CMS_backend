<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Link Sent - DO Record CMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/design_system.css">
  <style>
    body { background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; color: #f8fafc; }
    .auth-card { background-color: #111827; border: 1px solid #1f2937; border-radius: var(--radius-lg); width: 100%; max-width: 460px; padding: 2.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-card">
    <i class="fa-solid fa-paper-plane" style="font-size: 3rem; color: var(--brand-red); margin-bottom: 1rem;"></i>
    <h2 style="font-size: 1.4rem; color: white; margin-bottom: 0.5rem; font-family: 'Inter', sans-serif;">Reset Instructions Generated</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem;">
      If an account exists for <strong>{{ email }}</strong>, password reset instructions have been generated.
    </p>

    {% if demo_reset_url %}
    <div style="background-color: #1f2937; border: 1px dashed var(--brand-red); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: left;">
      <span style="font-size: 0.75rem; font-weight: 700; color: var(--brand-red); display: block; margin-bottom: 0.2rem;">SYSTEM DEMO SHORTCUT LINK:</span>
      <a href="{{ demo_reset_url }}" style="color: #60a5fa; font-size: 0.85rem; word-break: break-all;">
        Click here to reset password directly &rarr;
      </a>
    </div>
    {% endif %}

    <a href="/login" class="btn btn-outline" style="color: white; border-color: #374151;">Back to Login</a>
  </div>
</body>
</html>
