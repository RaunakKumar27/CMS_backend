<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - DO Record CMS</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/dorecord-logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/design_system.css">
  <style>
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #f8fafc;
    }
    .auth-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" title="DO Record" style="display: inline-block; text-decoration: none;">
        <img src="/static/assets/dorecord-logo.svg" alt="DO Record" class="logo-img login-logo-img">
      </a>
      <h2 style="font-size: 1.25rem; font-family: 'Inter', sans-serif; color: white; margin-top: 1rem;">Reset Password</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.25rem;">Enter your registered account email address to receive password reset instructions.</p>
    </div>

    <form action="/forgot-password" method="POST">
      <div class="form-group">
        <label class="form-label" style="color: #cbd5e1;">Account Email</label>
        <input type="email" name="email" class="form-control" style="background-color: #1f2937; border-color: #374151; color: white;" placeholder="name@dorecord.com" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
        Generate Password Reset Link
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="/login" style="font-size: 0.85rem; color: #94a3b8;"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
    </div>
  </div>

</body>
</html>
